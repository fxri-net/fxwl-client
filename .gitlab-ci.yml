# GitLab CI：完整校验（test）+ 文档站构建部署（pages）
# 校验步骤的唯一真源是 package.json 的 verify 脚本，此处只调用，不在 CI 里另写步骤清单，避免两侧漂移
# 作业镜像由 ci-templates 依据 .ci/toolchain.json 动态构建（Node + pnpm + Electron 运行库），不再现场安装
include:
  - project: fxri/develop/0001.base/ci-templates
    ref: main
    file: /dynamic-image.yml

# 全部作业只在默认分支执行，工具链作业随之收敛，避免分支推送反复触发镜像构建
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - test
  - deploy

# 与 .node-version 对齐，避免与 GitHub Actions 两侧 Node 版本漂移
.test-setup: &test-setup
  image:
    name: $CI_IMAGE
    pull_policy: if-not-present
  needs:
    - toolchain:spec
    - toolchain:ensure
  variables:
    # 构建期的 bytecode 插件要 spawn Electron 二进制编译 .jsc，二进制不可省
    # Runner 直连 github.com 下载超时，改走国内镜像；该镜像目录不带 v 前缀，故显式指定 {{ version }}
    ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
    ELECTRON_CUSTOM_DIR: "{{ version }}"
    # 下载缓存落在项目目录，配合下方 cache 跨 job 复用，避免 verify 与 pages 各下一遍约 92MB
    electron_config_cache: "$CI_PROJECT_DIR/.cache/electron"
  # 按分支复用：缓存内部按下载地址的目录哈希分桶，Electron 升级不会串包
  cache:
    key: "electron-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/electron/
  before_script:
    - pnpm install --frozen-lockfile

verify:
  <<: *test-setup
  stage: test
  script:
    # 文档站构建与产物断言在 pages 作业里做一次，这里跳过以免同一推送构建两次
    - pnpm verify --skip-docs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  <<: *test-setup
  stage: deploy
  script:
    # 站点参数优先取 CI/CD 变量；未定义时按 GitLab Pages 的默认形态推导，避免把部署位置写死在仓库里
    - export VITEPRESS_BASE="${VITEPRESS_BASE:-/$CI_PROJECT_NAME/}"
    # 站点实际挂在 /<项目名>/ 下，而 $CI_PAGES_URL 带完整命名空间路径、且不带尾斜杠：
    # 取其协议与主机作为站点根，再按项目名拼接并补尾斜杠。VitePress 的 sitemap/canonical
    # 按 hostname 相对拼接，路径或尾斜杠不对都会拼出访问不到的地址
    - export PAGES_ORIGIN="$(printf '%s' "$CI_PAGES_URL" | cut -d/ -f1-3)"
    - export SITE_URL="${SITE_URL:-$PAGES_ORIGIN/$CI_PROJECT_NAME/}"
    - export REPO_URL="${REPO_URL:-$CI_PROJECT_URL}"
    - pnpm docs:build
    # 发布前断言产物：404 页不得进入站点地图与站内搜索索引（与 CI 共用同一份脚本）
    - node scripts/check-docs-dist.mjs
    - rm -rf public && mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
  # 默认分支每次推送都重建：站点输入不止 docs/，枚举路径过滤必然漏项
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
