appId: net.fxri.fxwl-client
productName: 方弦物联：桌面终端
copyright: Copyright © 2023-2026 唐启云. All rights reserved.
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!config/*"
  - "!src/*"
  - "!website/*"
  - "!build/*"
  - "!{.github,.trae,.agents,.tasks}/*"
  - "!{electron.vite.config.ts,eslint.config.mjs,vitest.config.ts}"
  - "!{.prettierignore,.prettierrc,.node-version,CHANGELOG.md,README.md,NOTICE,TRADEMARK.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.main.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
afterSign: build/notarize.js
win:
  executableName: fxwl-client
nsis:
  artifactName: ${description}-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: "build/icon_mini.ico"
  uninstallerIcon: "build/icon_mini.ico"
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  artifactName: ${description}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${description}-${version}.${ext}
npmRebuild: false
